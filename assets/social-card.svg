<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e13"/>
      <stop offset="1" stop-color="#06090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#277f8c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#277f8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6eef7"/>
      <stop offset="0.6" stop-color="#f2f1ed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M250 0 V630 M400 0 V630 M550 0 V630 M700 0 V630 M850 0 V630 M1000 0 V630 M1150 0 V630"/>
  </g>

  <!-- contour -->
  <g fill="none" stroke="#79e6f2" stroke-opacity="0.28" stroke-width="1.4">
    <ellipse cx="960" cy="200" rx="320" ry="150"/>
    <ellipse cx="960" cy="200" rx="230" ry="108"/>
    <ellipse cx="960" cy="200" rx="140" ry="66"/>
  </g>

  <!-- monogram -->
  <g transform="translate(90 84)">
    <rect width="70" height="70" rx="18" fill="#0c1218" stroke="#79e6f2" stroke-opacity="0.4"/>
    <text x="35" y="47" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="30" font-weight="700" fill="#79e6f2">AT</text>
  </g>
  <text x="176" y="112" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="4" fill="#f2f1ed">ALEXANDER TASKAEV</text>
  <text x="176" y="140" font-family="'IBM Plex Mono', monospace" font-size="15" letter-spacing="6" fill="#6a747d">STRATEGY &amp; DEVELOPMENT</text>

  <!-- eyebrow -->
  <text x="90" y="330" font-family="'IBM Plex Mono', monospace" font-size="20" letter-spacing="7" fill="#a6eef7">СТРАТЕГИЯ • ДЕВЕЛОПМЕНТ • КООПЕРАЦИЯ</text>

  <!-- name -->
  <text x="86" y="430" font-size="118" font-weight="500" fill="#f2f1ed">Александр</text>
  <text x="86" y="540" font-size="118" font-weight="500" fill="url(#name)">Таскаев</text>

  <!-- footer chips -->
  <g font-family="'IBM Plex Mono', monospace" font-size="18" fill="#aeb7bf">
    <text x="90" y="600">Россия · Арктика · Дальний Восток</text>
    <text x="1110" y="600" text-anchor="end" fill="#6a747d">TSD Group · AP TRADE</text>
  </g>
</svg>
